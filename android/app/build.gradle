plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hisaab.billing'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hisaab.billing'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
    // On-device text recognition for reading label photos. The Latin model is bundled, so no internet is needed.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
