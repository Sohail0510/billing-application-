name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the app screens
        working-directory: web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --no-audit --no-fund
          node build.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../hisaab-billing.apk

      - name: Report the build error
        if: failure()
        shell: bash
        run: |
          { grep -A4 -E 'What went wrong|error: |Could not |Execution failed|Caused by' gradle-build.log || true; } | head -40 | while IFS= read -r line; do
            line=${line//%/%25}
            printf '::error::%s\n' "$line"
          done

      - name: Keep the build log if the build failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: hisaab-billing-apk
          path: hisaab-billing.apk

      - name: Publish the APK as the "Latest APK" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk hisaab-billing.apk \
            --title "Latest APK" \
            --notes "Built from commit ${GITHUB_SHA::7}. Download hisaab-billing.apk on your phone and open it to install." \
            --target "$GITHUB_SHA"
